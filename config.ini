# 该文件用于: 管理整个项目的非敏感配置.
# 敏感配置(密钥, 密码)一律不写在这里, 请配置到 .env 或系统环境变量中(参考 .env.example).
# 配置优先级: 系统环境变量 > .env > 本文件 > 代码默认值.

# MySQL 配置
[mysql]
host = localhost
user = root
# 密码属敏感配置 -> 请在 .env 中配置 MYSQL_PASSWORD, 此处留空.
password =
database = subjects_kg

# Redis 配置
[redis]
host = localhost
port = 6379
# 密码属敏感配置 -> 请在 .env 中配置 REDIS_PASSWORD, 此处留空(无密码则保持为空).
password =
db = 0

# 日志配置
[logger]
log_file = logs/app.log

# Milvus 配置
[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = edurag_final


# LLM 配置
[llm]
model = qwen-plus
# 密钥属敏感配置 -> 请在 .env 中配置 DASHSCOPE_API_KEY, 此处务必留空.
dashscope_api_key =
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 1200
child_chunk_size = 300
chunk_overlap = 50
retrieval_k = 3
candidate_m = 2

# 意图代表问句的两阶段检索阈值；初始值仅供开发，需用独立标注数据校准。
[intent]
bm25_threshold = 0.85
index_ttl_seconds = 60

# 已有 jpkb 热点问答的 BM25 匹配分数门槛；超过该值直接复用数据库答案。
[hot_questions]
bm25_threshold = 0.85
refresh_seconds = 60

# Jev 判断请求属于专业 RAG 问题还是通用模型问题；低置信度安全地走完整 RAG。
[jev]
model = jev-latest
timeout_seconds = 8
confidence_threshold = 0.7

# FAQ 的 BM25/向量阈值、top1-top2 最小分差和精确答案缓存有效期；检索阈值均需标注集校准。
[faq]
bm25_threshold = 0.85
bm25_margin = 0.05
vector_threshold = 0.92
vector_margin = 0.05
cache_ttl_seconds = 3600

# 文档上传原件保留位置、文件大小限制和单服务进程的最大并行摄取数。
[ingest]
upload_dir = rag_qa/data/uploads
max_upload_bytes = 52428800
max_concurrent = 2

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 12345678
